services:
  - type: web
    name: mabeny-portfolio-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run render-build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URLS
        sync: false
      - key: REQUEST_BODY_LIMIT
        value: 50mb
      - key: GITHUB_USERNAME
        value: Mabeny-dev
      - key: GITHUB_TOKEN
        sync: false
