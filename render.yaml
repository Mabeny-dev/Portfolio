services:
  - type: web
    name: mabeny-portfolio-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run render-build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URLS
        sync: false
      - key: REQUEST_BODY_LIMIT
        value: 50mb
      - key: GITHUB_USERNAME
        value: Mabeny-dev
      - key: GITHUB_TOKEN
        sync: false
      - key: SMTP_HOST
        value: smtp.zoho.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        value: info@johnmabeny.com
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM_NAME
        value: John Mabeny
      - key: MAIL_FROM_EMAIL
        value: info@johnmabeny.com
      - key: MAIL_REPLY_TO
        value: info@johnmabeny.com
      - key: WEBSITE_URL
        value: https://www.johnmabeny.com
